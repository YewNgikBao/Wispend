<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History & Recovery - WISPEND</title>

<!-- 关联清单 -->
<link rel="manifest" href="manifest.json">
<!-- 针对苹果 iOS 设备的专用图标支持 -->
<link rel="apple-touch-icon" sizes="180x180" href="https://lh3.google.com/u/0/d/1-WvkMpo2mSk6F3rouTRuoMFT7JAh5e9M">
<!-- 手机端全屏及主题色配置 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3b574a">

<!-- 引入 Tailwind CSS（用于实现响应式侧边栏和汉堡菜单） -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
}

body { 
  background-color: #f3f5f2; 
  color: #1f302b; 
  display: flex; 
  min-height: 100vh; 
}

/* 顶部 Profile 区域 */
.user-profile { 
  display: flex; 
  align-items: center; 
  gap: 12px; 
  cursor: pointer; 
  padding: 10px; 
  border-radius: 12px; 
  background: #e9efe7;
  transition: background 0.2s; 
  text-decoration: none; 
  color: inherit; 
  border: 1px solid #dcded9;
  margin-bottom: 25px;
}

.user-profile:hover { background: #dfe7dc; }

.avatar { 
  width: 38px; 
  height: 38px; 
  background: #4a7c6d; 
  color: white; 
  border-radius: 50%; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  font-weight: bold; 
  font-size: 16px; 
  flex-shrink: 0;
  overflow: hidden;
}

.user-name-title { font-weight: 700; font-size: 14px; color: #1f302b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.user-name-sub { font-size: 11px; color: #697d75; }

/* 导航区 */
.nav-section-title { font-size: 11px; font-weight: 700; color: #8e9f97; letter-spacing: 1px; margin-bottom: 12px; }
.nav-item { 
  display: block; 
  padding: 10px 14px; 
  color: #4e6158; 
  text-decoration: none; 
  border-radius: 8px; 
  font-size: 14px; 
  font-weight: 600; 
  margin-bottom: 4px; 
  transition: background 0.15s;
}

.nav-item.active { background: #dce5df; color: #1f302b; }
.nav-item:hover:not(.active) { background: #e8eee9; }

/* 左下角 Logo 区域 */
.sidebar-footer-logo { 
  display: flex; 
  align-items: center; 
  gap: 10px; 
  padding: 10px; 
  border-top: 1px solid #e2e8e4;
  padding-top: 15px;
}

.footer-logo-img { 
  width: 32px; 
  height: 32px; 
  border-radius: 8px; 
  object-fit: cover;
  flex-shrink: 0;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.footer-logo-title { font-weight: 800; font-size: 14px; color: #1f302b; }
.footer-logo-sub { font-size: 11px; color: #697d75; }

/* 主区域 Main Content */
.main-content { 
  flex: 1; 
  padding: 30px 40px; 
  overflow-y: auto; 
}

.top-header { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  margin-bottom: 25px; 
  flex-wrap: wrap;
  gap: 15px;
}

.greeting h1 { font-size: 26px; font-weight: 700; }
.greeting p { font-size: 13px; color: #697d75; margin-top: 4px; }

.panel { 
  background: white; 
  border-radius: 16px; 
  padding: 22px; 
  border: 1px solid #e1e8e3; 
  margin-bottom: 25px; 
}

.panel-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: #1f302b; }

/* 历史列表样式 */
.history-list { display: flex; flex-direction: column; gap: 12px; }

.history-card {
  background: #fafbf9;
  border: 1px solid #e9ede9;
  border-radius: 12px;
  transition: all 0.2s;
  overflow: hidden;
}

.history-card:hover {
  border-color: #d8ded8;
}

.history-summary-header {
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
  background: #fafbf9;
  transition: background 0.2s;
}

.history-summary-header:hover {
  background: #f4f7f4;
}

.history-summary-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.history-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 600;
}

.summary-title-text {
  font-size: 14px;
  font-weight: 700;
  color: #1f302b;
}

.history-summary-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.expire-text {
  font-size: 12px;
  color: #8e9f97;
  white-space: nowrap;
}

.expand-arrow {
  font-size: 12px;
  color: #8e9f97;
  transition: transform 0.3s ease;
}

.history-card.expanded .expand-arrow {
  transform: rotate(180deg);
}

.history-details-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease-in-out, padding 0.35s ease-in-out;
  padding: 0 20px;
  background: #ffffff;
  border-top: 1px solid transparent;
}

.history-card.expanded .history-details-body {
  max-height: 500px;
  padding: 16px 20px;
  border-top-color: #e9ede9;
}

.history-meta {
  font-size: 13px;
  color: #697d75;
  margin-bottom: 10px;
}

.history-comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
  margin-bottom: 12px;
  background: #f2f5f3;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #e1e8e3;
}

.compare-box {
  background: #ffffff;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #e4e9e5;
  font-size: 13px;
}

.compare-box.old { border-left: 3px solid #d97706; }
.compare-box.new { border-left: 3px solid #3b574a; }

.compare-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

.compare-box.old .compare-title { color: #b45309; }
.compare-box.new .compare-title { color: #3b574a; }

.history-reason {
  font-size: 13px;
  color: #4e6158;
  margin-bottom: 12px;
  background: #f0f4f1;
  padding: 8px 12px;
  border-radius: 6px;
}

.history-action-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #f0f4f1;
}

.btn-restore {
  background: #4a7c6d;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-restore:hover { background: #3b6458; }

.empty-state {
  text-align: center;
  padding: 40px;
  color: #8e9f97;
  font-size: 14px;
}
</style>
</head>

<body class="flex h-screen overflow-hidden text-gray-800">

<!-- 手机端半透明遮罩 (点击可关闭侧边栏) -->
<div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden lg:hidden transition-opacity"></div>

<!-- 左侧 Sidebar（手机端抽屉式隐藏，电脑端固定） -->
<aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-60 bg-[#f3f5f2] border-r border-[#e2e8e4] flex flex-col justify-between p-6 shrink-0 h-screen -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
<div>
  <!-- 手机端侧边栏内部的关闭按钮 -->
  <div class="flex justify-between items-center mb-6 lg:hidden">
    <span class="font-bold text-gray-800 text-sm">Menu</span>
    <button onclick="toggleSidebar()" class="text-gray-500 hover:text-gray-800 text-xl font-bold p-1">×</button>
  </div>

  <a href="profile.html" class="user-profile" title="View Profile">
    <div class="avatar" id="userAvatar">U</div>
    <div style="overflow: hidden;">
      <div class="user-name-title" id="userNameDisplay">User Name</div>
      <div class="user-name-sub">View Profile</div>
    </div>
  </a>

  <nav class="nav-section">
    <div class="nav-section-title">WORKSPACE</div>
    <a href="dashboard.html" class="nav-item">Dashboard</a>
    <a href="transactions.html" class="nav-item">Transactions</a>
    <a href="invoices.html" class="nav-item">Invoices</a>
    <a href="reports.html" class="nav-item">Reports</a>
    <a href="history.html" class="nav-item active">History</a>
  </nav>
</div>

<div class="sidebar-footer-logo">
  <img src="https://lh3.google.com/u/0/d/1-WvkMpo2mSk6F3rouTRuoMFT7JAh5e9M" alt="Logo" class="footer-logo-img">
  <div>
    <div class="footer-logo-title">WISPEND</div>
    <div class="footer-logo-sub">Financial Ledger</div>
  </div>
</div>
</aside>

<!-- 主界面 Main Content -->
<main class="main-content flex-1 overflow-y-auto p-4 sm:p-8">
<header class="top-header">
  <div class="flex items-center gap-3">
    <!-- 手机端“三条线”汉堡菜单按钮 -->
    <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg bg-white border border-gray-200 text-gray-600 hover:bg-gray-100 shadow-sm">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <div class="greeting">
      <h1>Operation History</h1>
      <p>Manage deleted transactions and modifications within 30 days. Click to expand details.</p>
    </div>
  </div>
</header>

<div class="panel">
  <div class="panel-title">Activity & Change Log (Retention: 30 Days)</div>
  <div class="history-list" id="historyContainer">
    <!-- 动态渲染 -->
  </div>
</div>
</main>

<!-- Firebase 核心逻辑 (Module) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  getDocs, 
  doc, 
  deleteDoc, 
  query, 
  where 
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKXFjTwZ92ITi-s4Sbph_bjNjuvkNQOb4",
  authDomain: "wispend-1234.firebaseapp.com",
  projectId: "wispend-1234",
  storageBucket: "wispend-1234.firebasestorage.app",
  messagingSenderId: "227503315553",
  appId: "1:227503315553:web:a913fdcab269787e926820",
  measurementId: "G-L3S3EK3Q1Z"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let allHistory = [];

window.onload = function() {
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      loadUserData(user);
      await loadHistoryFromCloud(user.uid);
      renderHistory();
    } else {
      window.location.href = "index.html";
    }
  });
};

// 控制手机端侧边栏的展开与折叠
window.toggleSidebar = function() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  if (sidebar.classList.contains("-translate-x-full")) {
    sidebar.classList.remove("-translate-x-full");
    overlay.classList.remove("hidden");
  } else {
    sidebar.classList.add("-translate-x-full");
    overlay.classList.add("hidden");
  }
}

function loadUserData(user) {
  const currentUser = JSON.parse(localStorage.getItem("wispendCurrentUser"));
  const userName = currentUser ? currentUser.name : user.email.split('@')[0];
  document.getElementById("userNameDisplay").textContent = userName;
  const avatarEl = document.getElementById("userAvatar");
  if (currentUser && currentUser.avatar) {
    avatarEl.innerHTML = `<img src="${currentUser.avatar}" alt="Avatar" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
  } else {
    avatarEl.textContent = userName.charAt(0).toUpperCase();
  }
}

async function loadHistoryFromCloud(uid) {
  try {
    const q = query(collection(db, "history"), where("userId", "==", uid));
    const querySnapshot = await getDocs(q);
    allHistory = [];
    querySnapshot.forEach((docSnap) => {
      allHistory.push({ firestoreId: docSnap.id, ...docSnap.data() });
    });
  } catch (e) {
    console.error("Error loading history from cloud: ", e);
    allHistory = JSON.parse(localStorage.getItem("wispendHistory") || "[]");
  }
}

async function renderHistory() {
  const container = document.getElementById("historyContainer");
  const now = new Date().getTime();
  const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;

  const validHistory = allHistory.filter(item => {
    const timestamp = item.deletedAtTimestamp || item.timestamp || now;
    return (now - timestamp) < thirtyDaysMs;
  });

  if (validHistory.length === 0) {
    container.innerHTML = `<div class="empty-state">No history records found in the last 30 days.</div>`;
    return;
  }

  container.innerHTML = "";

  validHistory.slice().reverse().forEach((item) => {
    const timestamp = item.deletedAtTimestamp || item.timestamp || now;
    const elapsedMs = now - timestamp;
    const remainingDays = Math.max(0, Math.ceil((thirtyDaysMs - elapsedMs) / (24 * 60 * 60 * 1000)));

    const card = document.createElement("div");
    card.className = "history-card";

    const entry = item.entry || item;
    const type = entry.type || 'Income';
    const isEdit = item.action === 'Edit Entry';
    const actionLabel = isEdit ? 'Edited' : 'Deleted';
    const actionBadgeStyle = isEdit ? 'background: #e1effe; color: #1e429f;' : 'background: #fde8e8; color: #c53929;';

    const summaryTitle = isEdit 
      ? `Transaction Modification (${entry.title || entry.desc || 'Item'})` 
      : `${entry.title || entry.desc || 'Untitled'} (${type})`;

    let detailsHTML = '';

    if (isEdit && item.oldEntry) {
      const oldE = item.oldEntry;
      const newE = entry;
      const oldAmountPrefix = oldE.type === 'Income' ? '+RM ' : '-RM ';
      const newAmountPrefix = newE.type === 'Income' ? '+RM ' : '-RM ';

      detailsHTML = `
        <div class="history-comparison">
          <div class="compare-box old">
            <div class="compare-title">📌 Before (原本账目)</div>
            <div><strong>Desc:</strong> ${oldE.title || oldE.desc || 'N/A'}</div>
            <div><strong>Type:</strong> ${oldE.type || 'N/A'}</div>
            <div><strong>Category:</strong> ${oldE.category || 'N/A'}</div>
            <div><strong>Amount:</strong> ${oldAmountPrefix}${parseFloat(oldE.amount || 0).toFixed(2)}</div>
            <div><strong>Date:</strong> ${oldE.date || 'N/A'}</div>
          </div>
          <div class="compare-box new">
            <div class="compare-title">✨ After (更改后)</div>
            <div><strong>Desc:</strong> ${newE.title || newE.desc || 'N/A'}</div>
            <div><strong>Type:</strong> ${newE.type || 'N/A'}</div>
            <div><strong>Category:</strong> ${newE.category || 'N/A'}</div>
            <div><strong>Amount:</strong> ${newAmountPrefix}${parseFloat(newE.amount || 0).toFixed(2)}</div>
            <div><strong>Date:</strong> ${newE.date || 'N/A'}</div>
          </div>
        </div>
        <div class="history-reason">
          <strong>Reason for editing:</strong> ${item.reason || 'No reason provided'}
        </div>
        <div class="history-meta">Logged Date: ${item.deletedAtDate || 'N/A'}</div>
      `;
    } else {
      const amountPrefix = type === 'Income' ? '+RM ' : '-RM ';
      detailsHTML = `
        <div class="history-meta">
          Amount: <strong>${amountPrefix}${parseFloat(entry.amount || 0).toFixed(2)}</strong> | Category: ${entry.category || 'General'} | Date: ${entry.date || 'N/A'}
        </div>
        <div class="history-reason">
          <strong>Reason for deletion:</strong> ${item.reason || 'No reason provided'}
        </div>
        <div class="history-action-footer">
          <span class="history-meta" style="margin-bottom:0;">Logged Date: ${item.deletedAtDate || 'N/A'}</span>
          <button class="btn-restore" onclick="window.restoreEntry('${item.firestoreId}')">Restore Entry</button>
        </div>
      `;
    }

    card.innerHTML = `
      <div class="history-summary-header" onclick="window.toggleHistoryCard(this)">
        <div class="history-summary-left">
          <span class="history-badge" style="${actionBadgeStyle}">${actionLabel}</span>
          <span class="summary-title-text">${summaryTitle}</span>
        </div>
        <div class="history-summary-right">
          <span class="expire-text">Expires in ${remainingDays} days</span>
          <span class="expand-arrow">▼</span>
        </div>
      </div>
      <div class="history-details-body">
        ${detailsHTML}
      </div>
    `;

    container.appendChild(card);
  });
}

window.toggleHistoryCard = function(headerEl) {
  const card = headerEl.parentElement;
  card.classList.toggle("expanded");
}

window.restoreEntry = async function(firestoreId) {
  const currentUser = auth.currentUser;
  if (!currentUser) return;

  const targetItem = allHistory.find(item => item.firestoreId === firestoreId);
  if (!targetItem) return;

  try {
    if (targetItem.entry) {
      await addDoc(collection(db, "transactions"), {
        ...targetItem.entry,
        userId: currentUser.uid
      });
    }

    await deleteDoc(doc(db, "history", firestoreId));

    allHistory = allHistory.filter(item => item.firestoreId !== firestoreId);
    localStorage.setItem("wispendHistory", JSON.stringify(allHistory));

    alert("Transaction restored successfully to cloud!");
    renderHistory();
  } catch (e) {
    console.error("Error restoring entry:", e);
    alert("Failed to restore entry.");
  }
}
</script>

</body>
</html>
