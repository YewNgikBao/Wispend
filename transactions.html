<!-- Modal 弹窗 -->

<!-- =========================
FIREBASE AUTH & FIRESTORE SYNC

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, addDoc, updateDoc, deleteDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKXFjTwZ92ITi-s4Sbph_bjNjuvkNQOb4",
  authDomain: "wispend-1234.firebaseapp.com",
  projectId: "wispend-1234",
  storageBucket: "wispend-1234.firebasestorage.app",
  messagingSenderId: "227503315553",
  appId: "1:227503315553:web:a913fdcab269787e926820",
  measurementId: "G-L3S3EK3Q1Z"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUid = null;
let selectedYear = new Date().getFullYear();
let activeTypeFilter = 'All';
let cachedEntries = [];
let cachedInvoices = [];
let unsubscribeEntries = null;

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUid = user.uid;
    await loadUserData(user);
    await initCategories();
    initRealtimeSync();
    document.getElementById('entryDate').valueAsDate = new Date();
    document.getElementById('entryDueDate').valueAsDate = new Date();
  } else {
    alert("Please login first!");
    window.location.href = "index.html";
  }
});

// 控制手机端侧边栏的展开与折叠
window.toggleSidebar = function() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  if (sidebar.classList.contains("-translate-x-full")) {
    sidebar.classList.remove("-translate-x-full");
    overlay.classList.remove("hidden");
  } else {
    sidebar.classList.add("-translate-x-full");
    overlay.classList.add("hidden");
  }
}

async function loadUserData(user) {
  try {
    const userDocRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userDocRef);
    let name = user.displayName || user.email.split('@')[0];
    let avatar = "";
    if (userSnap.exists()) {
      const data = userSnap.data();
      name = data.name || name;
      avatar = data.avatar || "";
    }
    document.getElementById("userNameDisplay").textContent = name;
    const avatarEl = document.getElementById("userAvatar");
    if (avatar) {
      avatarEl.innerHTML = `<img src="${avatar}" alt="Avatar" class="w-full h-full object-cover rounded-full">`;
    } else {
      avatarEl.textContent = name.charAt(0).toUpperCase();
    }
  } catch (error) {
    console.error("Error loading user profile:", error);
  }
}

async function initCategories() {
  let savedCats = ["Invoice", "Sales", "Facilities", "Logistics", "Payroll", "Others", "Payment Received"];
  try {
    const catDoc = await getDoc(doc(db, "users", currentUid, "settings", "categories"));
    if (catDoc.exists() && catDoc.data().list) {
      savedCats = catDoc.data().list;
      if (!savedCats.includes("Payment Received")) savedCats.push("Payment Received");
    }
  } catch (e) {
    console.log("Using default categories");
  }

  const filterSelect = document.getElementById("categoryFilter");
  filterSelect.innerHTML = '<option value="All">All categories</option>';
  const entrySelect = document.getElementById("entryCategory");
  entrySelect.innerHTML = '';

  savedCats.forEach(cat => {
    filterSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
    entrySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
  });
  checkCategoryField();
}

window.checkCategoryField = function() {
  const cat = document.getElementById("entryCategory").value;
  const dueDateGroup = document.getElementById("dueDateGroup");
  if (cat === "Invoice") {
    dueDateGroup.style.display = "block";
  } else {
    dueDateGroup.style.display = "none";
  }
}

function initRealtimeSync() {
  if (unsubscribeEntries) unsubscribeEntries();
  const q = query(collection(db, "transactions"), where("userId", "==", currentUid));

  unsubscribeEntries = onSnapshot(q, async (snapshot) => {
    cachedEntries = [];
    snapshot.forEach(docSnap => {
      cachedEntries.push({ id: docSnap.id, ...docSnap.data() });
    });

    try {
      const invoicesSnap = await getDocs(collection(db, "users", currentUid, "invoices"));
      cachedInvoices = [];
      invoicesSnap.forEach(docSnap => {
        cachedInvoices.push({ id: docSnap.id, ...docSnap.data() });
      });
    } catch (err) {
      console.error("Error fetching invoices:", err);
    }

    renderTransactions();
  }, (error) => {
    console.error("Error listening to transactions:", error);
  });
}

window.changeYear = function(delta) {
  selectedYear += delta;
  document.getElementById("yearDisplay").textContent = selectedYear;
  renderTransactions();
};

window.setTypeFilter = function(type, btnElement) {
  activeTypeFilter = type;
  document.querySelectorAll('.flex.bg-\\[\\#f0f4f1\\].p-1.rounded-full button').forEach(btn => {
    btn.classList.remove('bg-white', 'text-[#1f302b]', 'shadow-sm');
    btn.classList.add('text-[#697d75]');
  });
  btnElement.classList.add('bg-white', 'text-[#1f302b]', 'shadow-sm');
  btnElement.classList.remove('text-[#697d75]');
  renderTransactions();
};

function getInvoiceStatus(item) {
  const matched = cachedInvoices.find(inv => 
    (inv.number && item.desc && item.desc.includes(inv.number)) || 
    (inv.company && item.desc && item.desc.toLowerCase().includes(inv.company.toLowerCase())) ||
    (item.invoiceId && String(item.invoiceId) === String(inv.id))
  );

  if (matched) {
    const today = new Date();
    today.setHours(0,0,0,0);
    const due = new Date(matched.dueDate);
    if (matched.status !== 'Paid' && due < today) return 'Overdue';
    return matched.status || 'Pending';
  }
  return item.status || 'Pending';
}

window.renderTransactions = function() {
  const selectedCategory = document.getElementById("categoryFilter").value;
  const searchKeyword = document.getElementById("searchInput").value.trim().toLowerCase();

  let filtered = cachedEntries.filter(e => {
    if (!e.date) return false;
    const d = new Date(e.date);
    return d.getFullYear() === selectedYear;
  });

  if (activeTypeFilter !== 'All') {
    filtered = filtered.filter(e => e.type === activeTypeFilter);
  }

  if (selectedCategory !== 'All') {
    filtered = filtered.filter(e => e.category === selectedCategory);
  }

  if (searchKeyword !== '') {
    filtered = filtered.filter(e => {
      const descMatch = e.desc && e.desc.toLowerCase().includes(searchKeyword);
      const amountMatch = e.amount && (parseFloat(e.amount).toFixed(2).toString().includes(searchKeyword) || e.amount.toString().includes(searchKeyword));
      return descMatch || amountMatch;
    });
  }

  filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
  document.getElementById("transactionSubText").textContent = `${filtered.length} postings · Full Year ${selectedYear}`;

  const tbody = document.getElementById("transactionTableBody");
  tbody.innerHTML = "";

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-[#8e9f97] py-8 text-xs sm:text-sm">No transactions found for ${selectedYear}</td></tr>`;
    return;
  }

  filtered.forEach(e => {
    const tr = document.createElement("tr");
    tr.className = "cursor-pointer hover:bg-[#f7faf8] transition-colors border-b border-[#f5f7f5]";
    tr.onclick = () => openEditModal(e.id);

    const dateObj = new Date(e.date);
    const formattedDate = isNaN(dateObj.getTime()) ? e.date : dateObj.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });

    let catClass = 'cat-Default';
    if (['Sales', 'Invoice', 'Facilities', 'Logistics', 'Payroll'].includes(e.category)) {
      catClass = `cat-${e.category}`;
    } else if (e.category === 'Payment Received') {
      catClass = 'cat-PaymentReceived';
    }

    let dateDisplayHTML = formattedDate;
    let statusHTML = '';

    if (e.category === 'Invoice') {
      const dueDateStr = e.dueDate ? new Date(e.dueDate).toLocaleDateString('en-US', { month: 'short', day: '2-digit' }) : 'N/A';
      dateDisplayHTML = `<div class="text-xs">Issued: ${formattedDate}</div><div class="text-[11px] text-[#d97706] font-semibold">Due: ${dueDateStr}</div>`;
      const currentStatus = getInvoiceStatus(e);
      const statusClass = `status-${currentStatus.toLowerCase()}`;
      statusHTML = `<span class="status-tag ${statusClass} py-0.5 px-2 rounded-md text-[10px] font-bold ml-1.5 uppercase inline-block">${currentStatus}</span>`;
    }

    tr.innerHTML = `
      <td class="py-3.5 px-3 text-xs sm:text-sm">${dateDisplayHTML}</td>
      <td class="py-3.5 px-3 font-semibold text-[#1f302b] text-xs sm:text-sm">${e.desc}</td>
      <td class="py-3.5 px-3 text-xs">
        <span class="cat-tag ${catClass} py-1 px-2.5 rounded-full text-[11px] font-semibold inline-block">${e.category}</span>
        ${statusHTML}
      </td>
      <td class="py-3.5 px-3 text-right text-xs sm:text-sm ${e.type === 'Income' ? 'amt-income' : 'amt-expense'}">
        ${e.type === 'Income' ? '+' : '-'}RM ${parseFloat(e.amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}
      </td>
    `;
    tbody.appendChild(tr);
  });
};

window.openAddModal = function() {
  document.getElementById("modalTitle").textContent = "Add New Entry";
  document.getElementById("editDocId").value = "";
  document.getElementById("saveBtn").textContent = "Save Entry";
  document.getElementById("deleteBtn").style.display = "none";
  document.querySelector("#entryModal form").reset();
  document.getElementById('entryDate').valueAsDate = new Date();
  document.getElementById('entryDueDate').valueAsDate = new Date();
  checkCategoryField();
  document.getElementById("entryModal").classList.remove("hidden");
  document.getElementById("entryModal").classList.add("flex");
};

window.openEditModal = function(docId) {
  const item = cachedEntries.find(e => e.id === docId);
  if (!item) return;

  document.getElementById("modalTitle").textContent = "Edit Entry";
  document.getElementById("editDocId").value = docId;
  document.getElementById("entryType").value = item.type || 'Income';
  document.getElementById("entryDesc").value = item.desc || '';
  document.getElementById("entryAmount").value = item.amount || '';
  document.getElementById("entryDate").value = item.date || '';
  document.getElementById("entryDueDate").value = item.dueDate || '';
  document.getElementById("entryCategory").value = item.category || 'Sales';
  checkCategoryField();

  document.getElementById("saveBtn").textContent = "Update Entry";
  document.getElementById("deleteBtn").style.display = "block";
  document.getElementById("entryModal").classList.remove("hidden");
  document.getElementById("entryModal").classList.add("flex");
};

window.saveEntry = async function(event) {
  event.preventDefault();
  const editDocId = document.getElementById("editDocId").value;
  const category = document.getElementById("entryCategory").value;

  const entryData = {
    userId: currentUid,
    type: document.getElementById("entryType").value,
    desc: document.getElementById("entryDesc").value,
    amount: parseFloat(document.getElementById("entryAmount").value) || 0,
    date: document.getElementById("entryDate").value,
    dueDate: category === 'Invoice' ? document.getElementById("entryDueDate").value : "",
    category: category,
    createdAt: new Date().toISOString()
  };

  try {
    if (!editDocId) {
      await addDoc(collection(db, "transactions"), entryData);
    } else {
      await updateDoc(doc(db, "transactions", editDocId), entryData);
    }
    closeModal();
  } catch (error) {
    console.error("Error saving entry to cloud:", error);
    alert("Failed to save entry: " + error.message);
  }
};

window.deleteTransaction = async function() {
  const editDocId = document.getElementById("editDocId").value;
  if (!editDocId) {
    alert("错误：当前表单没有获取到任何 ID！");
    return;
  }

  const reason = prompt("Please enter the reason for deletion:");
  if (reason === null) return; 

  try {
    const deletedItem = cachedEntries.find(e => e.id === editDocId) || {};
    await deleteDoc(doc(db, "transactions", editDocId));

    try {
      await addDoc(collection(db, "history"), {
        userId: currentUid,
        action: 'Delete Entry',
        entry: {
          title: deletedItem.desc || 'Transaction Entry',
          desc: deletedItem.desc || 'Transaction Entry',
          amount: deletedItem.amount || 0,
          type: deletedItem.type || 'Expense',
          category: deletedItem.category || 'Others',
          date: deletedItem.date || new Date().toISOString()
        },
        reason: reason.trim() || 'No reason provided',
        timestamp: new Date().getTime(),
        deletedAtDate: new Date().toLocaleString()
      });
    } catch (historyError) {
      console.error("History log error:", historyError);
    }

    closeModal();
    alert("删除成功！");
    location.reload(); 
  } catch (error) {
    alert("删除失败，报错信息: " + error.message);
  }
};

window.closeModal = function() { 
  document.getElementById("entryModal").classList.add("hidden");
  document.getElementById("entryModal").classList.remove("flex");
};
</script>
